<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaFlow</title>
  <link rel="stylesheet" href="./src/popup.css">
</head>
<body>
  <div id="app" class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">LF</div>
        <div>
          <h1 class="logo-title">LinguaFlow</h1>
          <p class="logo-subtitle">In-Context Capture</p>
        </div>
      </div>
      <span id="auth-status-badge" class="badge">Checking...</span>
    </header>

    <!-- Logged In View -->
    <div id="logged-in-view" class="section hidden">
      <div class="user-card">
        <div class="user-info">
          <p id="user-name" class="user-name">User Name</p>
          <p id="user-email" class="user-email">user@example.com</p>
        </div>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Log out</button>
      </div>

      <div class="status-box">
        <p class="status-text">✨ <strong>Capture Mode Active</strong></p>
        <p class="status-desc">Select any word while browsing to get instant AI explanations and 1-click saving.</p>
      </div>

      <div class="actions-group">
        <button id="open-app-btn" class="btn btn-primary">Open LinguaFlow App</button>
      </div>
    </div>

    <!-- Logged Out View -->
    <div id="logged-out-view" class="section hidden">
      <p class="login-intro">Please log in to sync your captured vocabulary with your web account.</p>
      
      <form id="login-form" class="form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div id="login-error" class="error-msg hidden"></div>
        <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
      </form>
    </div>
  </div>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
